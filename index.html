
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAT ARCHIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,"Malgun Gothic",sans-serif}
header{background:#fff;border-bottom:1px solid #ddd;padding:35px 15px;text-align:center}
header small{letter-spacing:3px;color:#888;font-size:10px}
header h1{font-size:30px;letter-spacing:5px;margin:12px 0}
header p{font-size:11px;color:#999}
main{max-width:850px;margin:30px auto;padding:0 16px}
.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:18px}
h2{font-size:15px;margin:0 0 16px}
label{display:block;font-size:12px;color:#777;margin-bottom:7px}
input[type=text],textarea{
width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;
font-size:14px;outline:none;font-family:inherit
}
 select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:7px;
font-size:13px;
background:white;
color:#333;
font-family:inherit;
}

.setting-row{
margin-top:18px;
}
textarea{min-height:220px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-color:#555}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:7px;padding:13px 18px;background:#222;color:white;cursor:pointer;font-size:13px}
button:hover{background:#555}
button.secondary{background:#eee;color:#333}
button.secondary:hover{background:#ddd}
.hint{font-size:11px;color:#999;line-height:1.8;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{flex:1}
#status{font-size:12px;color:#777;margin-top:12px}
#conversation{background:white;border:1px solid #ddd;border-radius:12px;padding:25px 20px;min-height:180px}
.day{text-align:center;margin:28px 0 22px;color:#777;font-size:12px}
.day span{background:#eee;padding:7px 14px;border-radius:20px}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:17px 0}
.msg.right{align-items:flex-end}
 body.all-left .msg.right {
  align-items: flex-start;
}
.sender{font-size:11px;color:#888;margin:0 4px 6px}
.bubble{
max-width:82%;
padding:12px 15px;
border-radius:var(--bubble-radius, 6px);
background:#eee;
color:#222;
font-size:14px;
line-height:1.8;
white-space:pre-wrap;
overflow-wrap:anywhere
}.right .bubble{color:#222}
.empty{text-align:center;color:#aaa;padding:45px 10px;font-size:13px;line-height:2}
footer{text-align:center;padding:30px;color:#aaa;font-size:10px;letter-spacing:2px}
@media(max-width:550px){
header h1{font-size:25px}
.panel{padding:16px}
#conversation{padding:18px 12px}
.bubble{max-width:90%}
}
</style>
</head>
<body>
<header>
<h1>백업을 하자</h1>
</header>

<main>
<section class="panel">
<h2>01. 대화 내용 입력</h2>
<textarea id="chatInput" placeholder=""></textarea>
<div id="status">입력된 대화 없음</div>
</section>

<section class="panel">
<h2>02. 화자 설정</h2>
<div class="row">
<div>
<label for="nameA">왼쪽 화자</label>
<input type="text" id="nameA" value="화자 1">
</div>
<div>
<label for="nameB">오른쪽 화자</label>
<input type="text" id="nameB" value="화자 2">
</div>
</div>

<div class="row" style="margin-top:18px;">
<div>
<label for="leftColor">왼쪽 말풍선 색상</label>
<input type="text" id="leftColor" value="#eeeeee" placeholder="#eeeeee">
</div>
<div>
<label for="rightColor">오른쪽 말풍선 색상</label>
<input type="text" id="rightColor" value="#eeeeee" placeholder="#eeeeee">
</div>
</div>
<div class="setting-row">
  <label for="bubbleAlign">말풍선 위치</label>
  <select id="bubbleAlign">
    <option value="default">기존처럼 좌우 구분</option>
    <option value="left">모두 왼쪽 정렬</option>
  </select>
</div> 
 <div class="setting-row">
  <label for="bubbleRadius">말풍선 둥글기</label>
  <select id="bubbleRadius">
    <option value="24px">제일 둥글게</option>
    <option value="18px">카톡만큼</option>
    <option value="6px" selected>지금 같은 느낌</option>
    <option value="0px">완전 사각형</option>
  </select>
</div>
<div class="actions">
<button id="convert">대화록 변환하기</button>
<button class="secondary" id="clear">초기화</button>
</div>
</section>

<section class="panel">
<h2>03. 대화 미리보기</h2>
<div id="conversation">
<div class="empty">CHAT ARCHIVE</div>
</div>
<div class="actions">
<button id="download">HTML 복사하기</button>
</div>
</section>
</main>

<footer>CHAT ARCHIVE · PRIVATE RECORDS</footer>

<script>
let messages=[];
let participants=[];

const $=id=>document.getElementById(id);

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]));
}

function safeColor(value,fallback){
 const color=value.trim();
 return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(color)
  ? color
  : fallback;
}

// 카카오톡 복사 형식 분석
function parseChat(text){
 const lines=text.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n');
 const result=[];
 let currentDate='';
 let last=null;

 for(const line of lines){
  const trimmed=line.trim();

  if(!trimmed)continue;

  const dateMatch=trimmed.match(
   /(?:-+\s*)?(\d{4}년\s*\d{1,2}월\s*\d{1,2}일(?:\s+\S+요일)?)(?:\s*-+)?/
  );

  if(dateMatch && !/^\[/.test(trimmed)){
   currentDate=dateMatch[1];
   last=null;
   continue;
  }

  const match=trimmed.match(
   /^\[(.+?)\]\s+\[(오전|오후)\s*(\d{1,2}:\d{2})\]\s?(.*)$/
  );

  if(match){
   const sender=match[1].trim();
   const time=match[2]+' '+match[3];
   const content=match[4];
     .replace(/(^|\s)이모티콘(?=\s|$)/g, ' ')
  .trim();

if(!content) {
  last=null;
  continue;
}

   result.push({
    sender,
    time,
    content,
    date:currentDate
   });

   last=result[result.length-1];
  }else if(last){
   last.content+='\n'+line;
  }
 }
 return result;
}

function render(){
 const left=$('nameA').value.trim()||'화자 1';
 const right=$('nameB').value.trim()||'화자 2';
 const leftColor=safeColor($('leftColor').value,'#eeeeee');
 const rightColor=safeColor($('rightColor').value,'#eeeeee');

 if(!messages.length){
  $('conversation').innerHTML=
   '<div class="empty">대화를 먼저 입력해 줘.</div>';
  return;
 }

 let html='';
 let previousDate=null;

 messages.forEach(m=>{
  if(m.date && m.date!==previousDate){
   html+='<div class="day"><span>'+esc(m.date)+'</span></div>';
   previousDate=m.date;
  }

  const side=m.sender===participants[0]?'left':'right';
  const display=side==='left'?left:right;
  const bubbleColor=side==='left'?leftColor:rightColor;

  html+='<div class="msg '+side+'">';
  html+='<div class="sender">'+esc(display)+'</div>';
  html+='<div class="bubble" style="background-color:'+bubbleColor+'">'+esc(m.content)+'</div>';
  html+='</div>';
 });

 $('conversation').innerHTML=html;
}

$('convert').addEventListener('click',()=>{
 const raw=$('chatInput').value;

 if(!raw.trim()){
  $('status').textContent='대화 내용을 먼저 붙여넣자';
  return;
 }

 messages=parseChat(raw);
 participants=[...new Set(messages.map(m=>m.sender))];

 if(!messages.length){
  $('status').textContent='인식된 대화 없음. [이름] [오전 5:56] 형식인지 확인';
  return;
 }
 $('status').textContent='변환 완료';
 render();
});

$('clear').addEventListener('click',()=>{
 $('chatInput').value='';
 messages=[];
 participants=[];

 $('bubbleAlign').value='default';
 $('bubbleRadius').value='6px';

 document.body.classList.remove('all-left');
 document.documentElement.style.setProperty('--bubble-radius','6px');

 $('status').textContent='초기화.';
 render();
});

$('nameA').addEventListener('input',render);
$('nameB').addEventListener('input',render);
$('leftColor').addEventListener('input',render);
$('rightColor').addEventListener('input',render);
$('bubbleAlign').addEventListener('change', function () {
  document.body.classList.toggle(
    'all-left',
    this.value === 'left'
  );
});
 $('bubbleRadius').addEventListener('change', function () {
  document.documentElement.style.setProperty(
    '--bubble-radius',
    this.value
  );
});


$('download').addEventListener('click', async()=>{
 if(!messages.length){
  alert('먼저 대화를 변환해 줘!');
  return;
 }

 const left=esc($('nameA').value.trim()||'화자 1');
 const right=esc($('nameB').value.trim()||'화자 2');

 const leftColor=safeColor($('leftColor').value,'#eeeeee');
 const rightColor=safeColor($('rightColor').value,'#eeeeee');

 const radius=$('bubbleRadius').value;
 const alignClass=$('bubbleAlign').value==='left'?'all-left':'';

 let body='';
 let previousDate=null;

 messages.forEach(m=>{
  if(m.date && m.date!==previousDate){
   body+='<div class="day"><span>'+esc(m.date)+'</span></div>';
   previousDate=m.date;
  }

  const side=m.sender===participants[0]?'left':'right';
  const display=side==='left'?left:right;
  const bubbleColor=side==='left'?leftColor:rightColor;

  body+='<div class="msg '+side+'">';
  body+='<div class="sender">'+display+'</div>';
  body+='<div class="bubble" style="background-color:'+bubbleColor+'">'+esc(m.content)+'</div>';
  body+='</div>';
 });

 const css=`
.chat-archive-backup,
.chat-archive-backup *{
 box-sizing:border-box;
}

.chat-archive-backup{
 max-width:850px;
 margin:30px auto;
 padding:25px 20px;
 background:#fff;
 border:1px solid #ddd;
 border-radius:12px;
 color:#222;
 font-family:Arial,"Malgun Gothic",sans-serif;
}

.chat-archive-backup .archive-header{
 text-align:center;
 padding:25px 10px;
 border-bottom:1px solid #ddd;
 margin-bottom:25px;
}

.chat-archive-backup .archive-header h2{
 font-size:25px;
 letter-spacing:5px;
 margin:10px 0;
}

.chat-archive-backup .archive-header p{
 font-size:11px;
 color:#999;
}

.chat-archive-backup .msg{
 display:flex;
 flex-direction:column;
 align-items:flex-start;
 margin:17px 0;
}

.chat-archive-backup .msg.right{
 align-items:flex-end;
}

.chat-archive-backup.all-left .msg.right{
 align-items:flex-start;
}

.chat-archive-backup .sender{
 font-size:11px;
 color:#888;
 margin:0 4px 6px;
}

.chat-archive-backup .bubble{
 max-width:82%;
 padding:12px 15px;
 border-radius:${radius};
 color:#222;
 font-size:14px;
 line-height:1.8;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.chat-archive-backup .day{
 text-align:center;
 margin:28px 0 22px;
 color:#777;
 font-size:12px;
}

.chat-archive-backup .day span{
 display:inline-block;
 background:#eee;
 padding:7px 14px;
 border-radius:20px;
}

.chat-archive-backup .archive-footer{
 text-align:center;
 padding:25px 10px 5px;
 color:#aaa;
 font-size:10px;
 letter-spacing:2px;
}

@media(max-width:550px){
 .chat-archive-backup{
  padding:18px 12px;
 }
 .chat-archive-backup .bubble{
  max-width:90%;
 }
}
`;

 const output=
 '<style>'+css+'</style>'+
 '<div class="chat-archive-backup '+alignClass+'">'+
 '<div class="archive-header">'+
 '<h2>CHAT LOG.</h2>'+
 '<p>A COLLECTION OF OUR STORIES</p>'+
 '</div>'+
 body+
 '<div class="archive-footer">CHAT ARCHIVE · PRIVATE RECORDS</div>'+
 '</div>';

 try{
  await navigator.clipboard.writeText(output);
  alert('HTML 복사 완료');
 }catch(error){
  const textarea=document.createElement('textarea');
  textarea.value=output;
  textarea.style.position='fixed';
  textarea.style.opacity='0';
  document.body.appendChild(textarea);
  textarea.select();

  const copied=document.execCommand('copy');
  textarea.remove();

  if(copied){
   alert('HTML 복사 완료');
  }else{
   alert('복사 실패 (브라우저 권한 확인)');
  }
 }
});
</script>
</body>
</html>
